    <style>
        /* CSS Variables - Glassmorphism System Theme */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-hover: rgba(255, 255, 255, 0.15);
            --glass-bg-active: rgba(255, 255, 255, 0.22);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            --primary-accent: #818cf8;
            --primary-glow: rgba(129, 140, 248, 0.4);
            --secondary-accent: #c084fc;
            --success-color: #34d399;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            
            --safe-top: env(safe-area-inset-top, 0px);

        /* Base & Reset Rules */
        * {

            flex-direction: column;
            background: var(--bg-gradient);
            background-attachment: fixed;
            position: relative;

        .app-main {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .page-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;

            -webkit-overflow-scrolling: touch;

        /* Bottom Tab Bar (Customizable for future tabs) */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(64px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            gap: 4px;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .tab-item.active {
            color: var(--primary-accent);
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Common Glass Card UI Components */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: var(--glass-shadow);
            padding: 16px;
            margin: 12px 16px;
        }

        /* Loading Screen View CSS */
        .loading-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-accent);
            border-top-color: var(--secondary-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 24px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .canvas-fp-box {
            position: absolute;
            bottom: calc(var(--safe-bottom) + 24px);
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);

            color: var(--secondary-accent);
            margin-bottom: 4px;
            display: block;
        }

        /* Home Page Customization (Requirement: No "Home" text below loading circle) */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;

        .home-spinner-wrapper {
            display: flex;
            flex-direction: column;

            justify-content: center;
            margin-auto: auto;
        }

        .home-footer-fingerprint {
            position: absolute;
            bottom: calc(var(--safe-bottom) + 20px);

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;

            color: var(--primary-accent);

            margin-bottom: 4px;
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;

<body>
    <div id="app"></div>

    <script>
        // Vue 3 API extraction from global
        const { createApp, ref, onMounted, computed } = Vue;
        const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

        /* ========================================================================
           COMPONENT 1: Loading Page (Route: /loading)
           ======================================================================== */
        const LoadingPage = {
            template: `
                <div class="loading-page">
                    <div class="spinner-container">
                        <div class="loading-spinner"></div>
                    </div>
                    <div class="loading-text">Loading</div>
                    <div class="canvas-fp-box">
                        <span class="canvas-fp-label">Device Fingerprint</span>
                        {{ device }}
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();

                // EXACT REQUIRED CANVAS FINGERPRINT CODE BLOCK (Preserved Line-by-Line)
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        // The most common type
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        // Some tricks for color mixing to increase the difference in rendering
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                // Remote API Check Logic
                onMounted(() => {
                    const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
                    const identifier = window.appInformation.identifier;

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                // Redirect to third-party privacy confirmation page
                                window.location.replace(privacyUrl);
                                return;
                            }
                            // Redirect to Home
                            router.replace('/home');
                        })
                        .catch(function () {
                            // Redirect to Home on error/fallback
                            router.replace('/home');
                        });
                });

                return { device };
            }
        };

        /* ========================================================================
           COMPONENT 2: Home Page (Route: /home)
           ======================================================================== */
        const HomePage = {
            template: `
                <div class="page-container home-page">
                    <div class="home-spinner-wrapper">
                        <div class="spinner-container">
                            <div class="loading-spinner"></div>
                        </div>
                        <div class="loading-text">Loading</div>
                    </div>

                    <div class="home-footer-fingerprint">
                        <div class="home-fingerprint-title">CANVAS FINGERPRINT</div>
                        {{ device }}
                    </div>
                </div>
            `,
            setup() {
                // Device fingerprint calculation for Home Screen bottom display
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                return { device };
            }
        };

        /* ========================================================================
           ROUTER CONFIGURATION
           ======================================================================== */
        const routes = [
            { path: '/', redirect: '/loading' },
            { path: '/loading', name: 'Loading', component: LoadingPage, meta: { hideTabBar: true } },
            { path: '/home', name: 'Home', component: HomePage, meta: { hideTabBar: true } }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        /* ========================================================================
           MAIN VUE APPLICATION ROOT
           ======================================================================== */
        const App = {
            template: `
                <main class="app-main">
                    <router-view></router-view>
                </main>

                <!-- Bottom Tab Bar for multi-page extension -->
                <nav class="tab-bar" v-if="showTabBar">
                    <router-link 
                        v-for="item in tabItems" 
                        :key="item.path" 
                        :to="item.path" 
                        class="tab-item"
                        active-class="active"
                    >
                        <span v-html="item.icon"></span>
                        <span>{{ item.label }}</span>
                    </router-link>
                </nav>
            `,
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => !route.meta.hideTabBar);

                // Tab bar configuration reserved for future page extensions
                const tabItems = ref([
                    {
                        path: '/home',
                        label: 'Home',
                        icon: `<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`
                    }
                ]);

                return {
                    showTabBar,
                    tabItems
                };
            }
        };

        // Create & Mount App
        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
